name: CI/CD Deploy

on:
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Copy code
        run: |
          mkdir -p /home/Maalouf/myapp
          cp -r . /home/Maalouf/myapp
          
      - name: Deploy
        run: |
          mkdir -p ~/myapp
          rsync -av ./ ~/myapp/
