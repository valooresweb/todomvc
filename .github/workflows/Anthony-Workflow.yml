name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Copy code
        run: |
          mkdir -p /opt/myapp
          cp -r . /opt/myapp/
      
